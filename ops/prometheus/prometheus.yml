# Prometheus scrapes the wallet.
#
# The interesting configuration is not here, it is in the rules file: what we
# alert on says more about a system than what we collect.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: digital-wallet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wallet:8080']
